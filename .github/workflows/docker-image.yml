name: Docker image

on:
  push:
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
            type=sha

      # PR builds load into the local Docker daemon (never pushed) so the
      # smoke-test step below can run against them.
      - name: Build (PR — load for smoke test)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: houtini-lm:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Boots the freshly built image against an unreachable dummy backend and
      # confirms the MCP server itself comes up cleanly — startup model
      # profiling is expected to fail quietly against a dead endpoint, not
      # crash the process.
      - name: Smoke test (PR)
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm -di --name smoke-test \
            -e HOUTINI_LM_ENDPOINT_URL=http://127.0.0.1:9/v1 \
            houtini-lm:smoke
          sleep 10
          docker logs smoke-test 2>&1 | tee smoke.log
          if ! docker ps --filter name=smoke-test --filter status=running -q | grep -q .; then
            echo "::error::Container exited before the smoke check completed"
            docker logs smoke-test 2>&1 || true
            exit 1
          fi
          if ! grep -q "Houtini LM server running" smoke.log; then
            echo "::error::Expected startup line not found in container logs"
            exit 1
          fi
          docker stop smoke-test
        timeout-minutes: 1

      # Same idea as the stdio smoke test above, but for HOUTINI_LM_TRANSPORT=http:
      # boots the image in HTTP mode and drives a real MCP initialize handshake
      # over the wire to confirm the Streamable HTTP transport actually answers.
      - name: Smoke test (PR — HTTP transport)
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm -d --name smoke-http \
            -p 127.0.0.1:3000:3000 \
            -e HOUTINI_LM_TRANSPORT=http \
            -e HOUTINI_LM_ENDPOINT_URL=http://127.0.0.1:9/v1 \
            houtini-lm:smoke
          sleep 5
          curl -sS -D health-headers.txt -o health-body.txt --max-time 20 \
            http://127.0.0.1:3000/healthz
          curl -sS -D headers.txt -o body.txt -X POST http://127.0.0.1:3000/mcp \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci-smoke","version":"0"}}}' \
            --max-time 20
          ok=1
          grep -q "200" health-headers.txt || ok=0
          grep -q '"status":"ok"' health-body.txt || ok=0
          grep -qi "mcp-session-id" headers.txt || ok=0
          grep -q '"result"' body.txt || ok=0
          grep -q '"serverInfo"' body.txt || ok=0
          if [ "$ok" -ne 1 ]; then
            echo "::error::HTTP smoke check failed — /healthz or /mcp response missing expected content"
            echo "--- health-headers.txt ---"; cat health-headers.txt || true
            echo "--- health-body.txt ---"; cat health-body.txt || true
            echo "--- headers.txt ---"; cat headers.txt || true
            echo "--- body.txt ---"; cat body.txt || true
            docker logs smoke-http || true
            docker stop smoke-http || true
            exit 1
          fi
          docker stop smoke-http
        timeout-minutes: 1
