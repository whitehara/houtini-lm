# Docker Swarm deployment: houtini-lm + mcp-auth-proxy (OIDC-authenticated sidecar).
# Deploy as a standalone stack (e.g. `houtini_lm_stack`) via Portainer.
#
# Environment variables referenced below (set as stack env vars in Portainer,
# never committed here):
# HOUTINI_LM_IMAGE_TAG      — GHCR image tag to deploy (optional, default: latest)
# HOUTINI_LM_PUBLIC_HOST    — public hostname this stack is reached at (required)
# HOUTINI_LM_ENDPOINT_URL   — OpenAI-compatible backend base URL, no /v1 suffix (optional, default: https://openrouter.ai/api)
# HOUTINI_LM_API_KEY        — backend API key for the configured provider (required, secret)
# HOUTINI_LM_MODEL          — default model id to pin (optional, default: unset = auto-route). Leaving
#                             this unset on a large-catalogue backend like OpenRouter (300+ models,
#                             all reporting as routable) makes auto-routing pick whichever model
#                             happens to sort first in that backend's catalogue, which can change
#                             without warning — pin this explicitly on such backends.
# HOUTINI_LM_FILE_ROOTS     — code_task_files allow-list; defaults to the houtini-lm_shared
#                             NFS mount below so remote clients can hand files to code_task_files
#                             by writing into that shared tree. Point at a non-existent path to
#                             seal file access off remotely instead (optional, default: shared mount)
# HOUTINI_LM_SERIALISE      — serialise concurrent inference calls, 0/1 (optional, default: 0 — no benefit against a cloud backend)
# HOUTINI_LM_CROSS_PROCESS_LOCK — cross-process inference lock, 0/1 (optional, default: 0)
# HOUTINI_LM_CONVERSATIONS       — enable/disable server-side conversations (start_conversation/
#                             conversation_id on chat and custom_prompt, plus the conversations
#                             tool), 1/0 (optional, default: 1)
# HOUTINI_LM_CONVERSATION_TTL_MIN   — conversation idle-expiry window in minutes (optional, default: 60)
# HOUTINI_LM_CONVERSATION_MAX       — max conversations held at once, across all connections (optional, default: 50)
# HOUTINI_LM_CONVERSATION_MAX_TURNS — max turns retained per conversation (optional, default: 40)
# HOUTINI_LM_CONVERSATION_MAX_CHARS — max chars retained per conversation (optional, default: 48000)
#                             Unlike the variables above, these five are passed through below with
#                             an empty-string fallback (${VAR:-}), not a number baked into this
#                             file — the one true default for each lives in src/index.ts, so this
#                             file can never silently drift out of sync with it.
# HOUTINI_LM_CONVERSATION_OWNER_HEADER — name of an HTTP request header carrying an authenticated
#                             user identity (optional, default: unset = conversations are scoped to
#                             the MCP session instead). Only set this if the front-end proxy in
#                             front of this stack *replaces* any client-supplied header of the same
#                             name rather than appending to it — an appending proxy would let a
#                             client spoof another user's identity. This must name the same header
#                             MCP_AUTH_PROXY_HEADER_MAPPING (below) is configured to set, or the
#                             header this server looks for will never arrive. Also governs who owns
#                             an async job below — jobs and conversations share this one setting.
# HOUTINI_LM_JOBS                — enable/disable async jobs (async: true on custom_prompt/
#                             code_task_files, plus the jobs tool), 1/0 (optional, default: 1).
#                             Doubles as a production kill switch: set to 0 and redeploy to fall
#                             back to fully synchronous behaviour without rolling back the image.
# HOUTINI_LM_JOB_TTL_MIN          — job-record idle-expiry window in minutes, from submission (optional, default: 60)
# HOUTINI_LM_JOB_MAX               — max job records held at once, across all owners (optional, default: 50)
# HOUTINI_LM_JOB_ACTIVE_MAX_PER_OWNER — max pending/running jobs a single owner may have at once (optional, default: 2)
# HOUTINI_LM_JOB_CONCURRENCY       — max jobs actually running inference at once, across all owners (optional, default: 1)
# HOUTINI_LM_JOB_SOFT_TIMEOUT_MIN  — per-job soft timeout in minutes (optional, default: 15)
# HOUTINI_LM_JOB_MAX_RESULT_CHARS  — max characters kept for a completed job's result (optional, default: 200000)
#                             Like the conversation variables above, these seven are passed through
#                             below with an empty-string fallback (${VAR:-}) rather than a number
#                             baked into this file — the one true default for each lives in
#                             src/index.ts, so this file can never silently drift out of sync with it.
# MCP_AUTH_PROXY_HEADER_MAPPING — mcp-auth-proxy's `--header-mapping`/`HEADER_MAPPING` equivalent:
#                             a JSON-pointer-to-header-name mapping (e.g. "/sub:X-Forwarded-User")
#                             that forwards an OIDC claim as the request header
#                             HOUTINI_LM_CONVERSATION_OWNER_HEADER above expects (optional, default:
#                             unset). Leave both of these two variables unset together; setting only
#                             one has no effect.
# MCP_AUTH_PROXY_HEADER_MAPPING_BASE — mcp-auth-proxy's `--header-mapping-base`/`HEADER_MAPPING_BASE`
#                             equivalent: the JSON-pointer base path the above mapping's pointers are
#                             resolved against (optional, default when unset: mcp-auth-proxy's own
#                             default of "/userinfo", i.e. a nested OIDC userinfo claim). Set to "/"
#                             to resolve pointers against the top-level claims of the bearer token
#                             mcp-auth-proxy itself issues instead — do this when mapping a claim
#                             (like "sub") that's always present at that top level, since some OIDC
#                             flows don't reliably carry a nested "userinfo" claim onto that token.
# OIDC_CLIENT_ID            — OIDC client id for mcp-auth-proxy (required, secret)
# OIDC_CLIENT_SECRET        — OIDC client secret for mcp-auth-proxy (required, secret)
# OIDC_CONFIGURATION_URL    — OIDC discovery document URL (required, secret)
# OIDC_ALLOWED_USERS_GLOB   — glob restricting which authenticated users may connect (optional, default: unrestricted).
#                             With HOUTINI_LM_FILE_ROOTS pointed at a shared mount, every
#                             authenticated user allowed through this glob can read that mount's
#                             contents via code_task_files — keep this glob scoped accordingly.
# NFS_SERVER_ADDR           — hostname/IP of the NFS server backing houtini-lm_auth_data and houtini-lm_shared (required, homelab-specific)
#
# code_task_files file sharing: HOUTINI_LM_FILE_ROOTS below defaults to /mnt/houtini-lm-share,
# which the houtini-lm_shared volume mounts read-only into the container. This requires an NFS
# export at NFS_SERVER_ADDR:/docker-volumes/houtini-lm_shared to already exist — if it doesn't,
# the houtini-lm task will fail to start. Clients pass code_task_files the same absolute path
# (/mnt/houtini-lm-share/...) that they used to write the file, so they must mount the same NFS
# export at that same path themselves. Defense against opening this up is layered: (1) the mount
# below is read-only, so the container can only read the shared tree, never write to it; (2)
# HOUTINI_LM_FILE_ROOTS confines code_task_files to that tree and nothing else; (3)
# OIDC_ALLOWED_USERS_GLOB above controls who can reach code_task_files at all. All three need to
# hold for this to be safe — do not drop the :ro flag or widen HOUTINI_LM_FILE_ROOTS without
# reconsidering (2), and do not loosen the glob without reconsidering (3).

volumes:
  houtini-lm-state:
  houtini-lm_auth_data:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${NFS_SERVER_ADDR},hard,nfsvers=4.2,nconnect=4,noresvport"
      device: ":/docker-volumes/houtini-lm_auth_data"
  houtini-lm_shared:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${NFS_SERVER_ADDR},hard,nfsvers=4.2,nconnect=4,noresvport,actimeo=1"
      device: ":/docker-volumes/houtini-lm_shared"

networks:
  internal-net:
  traefik_stack_public_net:
    external: true

services:
  houtini-lm:
    image: ghcr.io/whitehara/houtini-lm:${HOUTINI_LM_IMAGE_TAG:-latest}
    environment:
      - HOUTINI_LM_TRANSPORT=http
      - HOUTINI_LM_HTTP_PORT=3000
      # mcp-auth-proxy's URL-backend mode assumes the backend serves MCP at
      # its root path (matching this homelab's other MCP services); it does
      # not correctly resolve OAuth protected-resource metadata or token
      # resource/audience for a non-root backend path.
      - HOUTINI_LM_HTTP_PATH=/
      - HOUTINI_LM_ENDPOINT_URL=${HOUTINI_LM_ENDPOINT_URL:-https://openrouter.ai/api}
      - HOUTINI_LM_API_KEY=${HOUTINI_LM_API_KEY:-}
      - HOUTINI_LM_MODEL=${HOUTINI_LM_MODEL:-}
      - HOUTINI_LM_FILE_ROOTS=${HOUTINI_LM_FILE_ROOTS:-/mnt/houtini-lm-share}
      - HOUTINI_LM_SERIALISE=${HOUTINI_LM_SERIALISE:-0}
      - HOUTINI_LM_CROSS_PROCESS_LOCK=${HOUTINI_LM_CROSS_PROCESS_LOCK:-0}
      - HOUTINI_LM_CONVERSATIONS=${HOUTINI_LM_CONVERSATIONS:-}
      - HOUTINI_LM_CONVERSATION_TTL_MIN=${HOUTINI_LM_CONVERSATION_TTL_MIN:-}
      - HOUTINI_LM_CONVERSATION_MAX=${HOUTINI_LM_CONVERSATION_MAX:-}
      - HOUTINI_LM_CONVERSATION_MAX_TURNS=${HOUTINI_LM_CONVERSATION_MAX_TURNS:-}
      - HOUTINI_LM_CONVERSATION_MAX_CHARS=${HOUTINI_LM_CONVERSATION_MAX_CHARS:-}
      - HOUTINI_LM_CONVERSATION_OWNER_HEADER=${HOUTINI_LM_CONVERSATION_OWNER_HEADER:-}
      - HOUTINI_LM_JOBS=${HOUTINI_LM_JOBS:-}
      - HOUTINI_LM_JOB_TTL_MIN=${HOUTINI_LM_JOB_TTL_MIN:-}
      - HOUTINI_LM_JOB_MAX=${HOUTINI_LM_JOB_MAX:-}
      - HOUTINI_LM_JOB_ACTIVE_MAX_PER_OWNER=${HOUTINI_LM_JOB_ACTIVE_MAX_PER_OWNER:-}
      - HOUTINI_LM_JOB_CONCURRENCY=${HOUTINI_LM_JOB_CONCURRENCY:-}
      - HOUTINI_LM_JOB_SOFT_TIMEOUT_MIN=${HOUTINI_LM_JOB_SOFT_TIMEOUT_MIN:-}
      - HOUTINI_LM_JOB_MAX_RESULT_CHARS=${HOUTINI_LM_JOB_MAX_RESULT_CHARS:-}
    volumes:
      - houtini-lm-state:/home/node/.houtini-lm
      - houtini-lm_shared:/mnt/houtini-lm-share:ro
    networks:
      - internal-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      mode: replicated
      # Server-side conversations AND async jobs both live in memory, per
      # process, not shared across replicas — raising this above 1 would
      # let a client's calls land on a different replica mid-conversation
      # (silently losing its history) or land a jobs poll on a replica
      # that never saw the job it's asking about. Keep this at 1 (or set
      # HOUTINI_LM_CONVERSATIONS=0 and HOUTINI_LM_JOBS=0 first).
      replicas: 1
      restart_policy:
        condition: any
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
      labels:
        - traefik.enable=false

  mcp-auth-proxy:
    image: ghcr.io/sigbit/mcp-auth-proxy:latest
    environment:
      - HEADER_MAPPING=${MCP_AUTH_PROXY_HEADER_MAPPING:-}
      - HEADER_MAPPING_BASE=${MCP_AUTH_PROXY_HEADER_MAPPING_BASE:-}
    command:
      - "--external-url=https://${HOUTINI_LM_PUBLIC_HOST}"
      - "--no-auto-tls"
      - "--listen=:80"
      - "--trusted-proxies=0.0.0.0/0"
      - "--data-path=/data"
      - "--oidc-client-id=${OIDC_CLIENT_ID}"
      - "--oidc-client-secret=${OIDC_CLIENT_SECRET}"
      - "--oidc-configuration-url=${OIDC_CONFIGURATION_URL}"
      - "--oidc-provider-name=Cloudflare Access"
      - "--oidc-allowed-users-glob=${OIDC_ALLOWED_USERS_GLOB:-}"
      - "--"
      - "http://houtini-lm:3000"
    volumes:
      - houtini-lm_auth_data:/data
    networks:
      - internal-net
      - traefik_stack_public_net
    depends_on:
      - houtini-lm
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: any
      labels:
        - tunnel-sync.enable=true
        - traefik.enable=true
        - traefik.docker.network=traefik_stack_public_net
        - traefik.http.routers.houtini-lm.rule=Host(`${HOUTINI_LM_PUBLIC_HOST}`)
        - traefik.http.routers.houtini-lm.entrypoints=http
        - traefik.http.routers.houtini-lm.service=houtini-lm-service
        - traefik.http.routers.houtini-lm.middlewares=houtini-lm-cors
        - traefik.http.services.houtini-lm-service.loadbalancer.server.port=80
        - traefik.http.middlewares.houtini-lm-cors.headers.accesscontrolalloworiginlist=https://dash.cloudflare.com
        - traefik.http.middlewares.houtini-lm-cors.headers.accesscontrolallowmethods=GET,POST,OPTIONS,DELETE
        - traefik.http.middlewares.houtini-lm-cors.headers.accesscontrolallowheaders=Authorization,Content-Type,Accept,Mcp-Session-Id,Mcp-Protocol-Version
        - traefik.http.middlewares.houtini-lm-cors.headers.accesscontrolexposeheaders=Mcp-Session-Id
        - traefik.http.middlewares.houtini-lm-cors.headers.accesscontrolmaxage=600
        - traefik.http.middlewares.houtini-lm-cors.headers.addvaryheader=true
